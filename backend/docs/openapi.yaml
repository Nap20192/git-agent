openapi: 3.1.0
info:
  title: git-agent hub
  version: 0.1.0
  description: >
    Go-бекенд (hub): пользователи и OAuth-связки, подключение репозиториев,
    приём вебхуков, Сборки/Экземпляры Агентов, раннеры. Решения — .wayfinder/map.md.
    Auth: session cookie (роуты /api/*, кроме раннерных), раннеры — заголовок
    X-Runner-Token (общий секрет RUNNER_TOKEN), вебхуки — подпись провайдера.
    Ошибки (любой 4xx/5xx) — ApiError {"error": {"code", "message"}}, как у
    Python-gateway (frontend/docs/openapi.yaml); message — человекочитаемая причина.
    Сквозной trace_id: КАЖДЫЙ запрос принимает заголовок X-Trace-Id
    (#/components/parameters/TraceId; 32 hex, uuid4 без дефисов — невалидный
    или отсутствующий hub заменяет своим) и КАЖДЫЙ ответ возвращает его
    (#/components/headers/TraceId). Тот же id: в логах hub/раннера (поле
    trace_id), в Event.traceId (hub.events) и в ActivityEvent.traceId
    (hub.activity), в Rabbit-сообщении События (traceId), в тегах
    Langfuse/LangSmith (trace:<id>) и в заголовке всех вызовов hub → раннер /
    провайдер / OpenSandbox. Здесь не повторяется на каждом пути.
    Rabbit-сообщение События (exchange events, key provider.repoId.action):
    {eventId, instanceId, threadId, repositoryId, provider, action, commitSha,
    ref, dedupKey, traceId} + необязательный diff-контекст (только заполненные
    ключи): beforeSha, baseSha, headSha, prNumber, prTitle, prBody,
    changedFiles — те же поля, что в #/components/schemas/Event. Раннер по
    ним аудитит дифф (before..commit / base..head), без них — репозиторий целиком.

paths:
  # ── Auth ────────────────────────────────────────────────────────────
  /api/auth/{provider}/login:
    get:
      summary: Redirect на OAuth провайдера (вход или добавление связки под сессией)
      description: >
        Ставит anti-CSRF state-cookie и редиректит на провайдера. 503 —
        OAuth-ключи провайдера не заданы (*_OAUTH_CLIENT_ID/SECRET в .env),
        сервис при этом работает.
      parameters: [{ $ref: "#/components/parameters/Provider" }]
      responses:
        "302": { description: redirect на провайдера }
        "503": { description: провайдер не сконфигурирован }
  /api/auth/{provider}/callback:
    get:
      summary: OAuth callback — создаёт user+связку (или добавляет связку), ставит cookie
      description: >
        Проверяет state (400 при несовпадении), меняет код на токен, читает
        профиль. Без сессии — вход (пользователь находится по связке либо
        создаётся); с живой сессией — добавление связки текущему пользователю
        (409, если связка принадлежит другому). Токены — шифром в БД; сессия —
        opaque-токен в httpOnly cookie; redirect на FRONTEND_URL.
      parameters: [{ $ref: "#/components/parameters/Provider" }]
      responses:
        "302": { description: redirect на фронт }
        "400": { description: невалидный state }
        "409": { description: связка принадлежит другому пользователю }
  /api/auth/logout:
    post: { summary: Завершить сессию, responses: { "204": { description: ok } } }
  /api/me:
    get:
      summary: Текущий пользователь со связками
      responses:
        "200":
          content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } }

  /api/identities:
    get:
      summary: Связки пользователя
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Identity" } }
  /api/identities/{id}:
    delete:
      summary: Удалить связку
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: ok } }
  /api/identities/{id}/repos:
    get:
      summary: Репозитории, видимые связке (прокси API провайдера)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ProviderRepo" } }

  # ── Репозитории и События ───────────────────────────────────────────
  /api/repositories:
    get:
      summary: Подключённые репозитории
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Repository" } }
    post:
      summary: Подключить репозиторий
      description: |
        Два способа (тикет 015):
        - `{identityId, externalId}` — свой репо через связку, hub ставит webhook (`mode: hook`);
        - `{url}` — чужой публичный репо по `https://github.com/{owner}/{repo}` /
          `https://gitlab.com/{group}/{repo}`: проверка публичным API без токена,
          хук не ставится, запуск только руками (`mode: watch`).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - required: [identityId, externalId]
                - required: [url]
              properties:
                identityId: { type: integer }
                externalId: { type: string }
                url: { type: string, format: uri, description: "watch: URL публичного репозитория" }
                buildId:
                  type: [integer, "null"]
                  deprecated: true
                  description: "тикет 011: транслируется в подписку Сборки на все события"
      responses:
        "201":
          content: { application/json: { schema: { $ref: "#/components/schemas/Repository" } } }
        "400": { description: "ни одной формы тела / URL не github.com|gitlab.com/{owner}/{repo}" }
        "422": { description: "watch: repository is private or not found" }
  /api/repositories/{id}:
    patch:
      summary: Привязать Сборку (deprecated — используй подписки)
      deprecated: true
      description: >
        Тикет 011: привязка Сборок — подписками. {buildId} транслируется в
        подписку этой Сборки на все события; buildId=null — 400
        (управление — через /api/repositories/{id}/subscriptions).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { buildId: { type: integer } } }
      responses:
        "200":
          content: { application/json: { schema: { $ref: "#/components/schemas/Repository" } } }
    delete:
      summary: Отключить (снимает webhook)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: ok } }
  /api/repositories/{id}/events:
    get:
      summary: Журнал Событий репозитория
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Event" } }

  /api/repositories/{id}/findings:
    get:
      summary: Находки сводно по всем Экземплярам Репозитория
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/FindingSeverity"
        - $ref: "#/components/parameters/FindingCategory"
        - $ref: "#/components/parameters/FindingEventId"
        - $ref: "#/components/parameters/FindingIntroducedBy"
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Finding" } }
  /api/repositories/{id}/findings/export:
    get:
      summary: Табличный экспорт Находок Репозитория (как у Экземпляра)
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ExportFormat"
        - $ref: "#/components/parameters/FindingSeverity"
        - $ref: "#/components/parameters/FindingCategory"
        - $ref: "#/components/parameters/FindingEventId"
        - $ref: "#/components/parameters/FindingIntroducedBy"
      responses:
        "200":
          content:
            text/csv: { schema: { type: string } }
            text/markdown: { schema: { type: string } }
        "400": { description: format не csv|md }
  /api/repositories/{id}/raise:
    post:
      summary: Поднять агента без скана
      description: >
        Экземпляры Сборок, что отвечают за Репозиторий (подписки, иначе
        дефолтная — как у trigger), создаются при нужде и поднимаются на
        Раннере (песочница обеспечивается). Событие не публикуется, ход не
        начинается. instances пуст — ни одна Сборка не обслуживает репо.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  instances:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        status: { type: string, enum: [running, queued] }
  /api/repositories/{id}/reports:
    get:
      summary: Отчёты всех Экземпляров Репозитория (новые сверху; коммит — по eventId из журнала)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Report" } }
  /api/repositories/{id}/trigger:
    post:
      summary: Запустить агента вручную (без вебхука)
      description: >
        Синтезирует Событие action=manual (mode=full — action=full_scan,
        полный security-аудит) и прогоняет его тем же fan-out, что
        и вебхук (подписки → Экземпляры → outbox). commitSha не задан —
        резолвится HEAD ref (по умолчанию — default-ветки) через API
        провайдера (watch-репо без связки — публичным API без токена). Перед
        публикацией у каждого затронутого Экземпляра обеспечивается живая
        песочница: нет/dead — hub создаёт её из sandbox_connection Сборки и
        привязывает; ошибка OpenSandbox — 502, Событие не публикуется. Повторный запуск на том же коммите в том же режиме
        идемпотентен (duplicate=true, ничего не создаётся); dedup-ключ
        full-режима — "full-"+sha, полный скан возможен и на уже
        разобранном коммите. manual несёт beforeSha = коммит последнего
        успешно обработанного События репо (диапазон «с прошлого ревью»);
        нет такого или совпадает с commitSha — пусто.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ref: { type: string, description: ветка/тег; пусто = default-ветка }
                commitSha: { type: string, description: явный коммит; пусто = HEAD ref }
                mode:
                  type: string
                  enum: [manual, full]
                  default: manual
                  description: full — полный security-аудит всего репозитория
      responses:
        "202":
          content:
            application/json:
              schema:
                type: object
                required: [commitSha, duplicate, instanceIds]
                properties:
                  commitSha: { type: string }
                  duplicate: { type: boolean }
                  instanceIds:
                    type: array
                    items: { type: integer }
                    description: затронутые Экземпляры (пуст при duplicate или без подписок)

  /api/repositories/{id}/subscriptions:
    get:
      summary: Подписки Сборок на события репозитория (тикет 011)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/BuildSubscription" } }
    post:
      summary: Создать/обновить подписку (upsert по паре Сборка+репозиторий)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [buildId]
              properties:
                buildId: { type: integer }
                actions:
                  type: array
                  items: { type: string }
                  description: пустой список = все действия
                refMask:
                  type: [string, "null"]
                  description: glob-маска ветки/тега без префикса refs/ ("release/*"); null = любой ref
      responses:
        "201":
          content: { application/json: { schema: { $ref: "#/components/schemas/BuildSubscription" } } }
  /api/subscriptions/{id}:
    delete:
      summary: Удалить подписку
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: ok } }

  # ── Webhook-приёмник (подпись per-repo; наружу всегда 200) ──────────
  /hooks/{provider}/{repositoryId}:
    post:
      summary: Приём вебхука; журнал+outbox в одной транзакции
      parameters:
        - { $ref: "#/components/parameters/Provider" }
        - { name: repositoryId, in: path, required: true, schema: { type: integer } }
      responses: { "200": { description: всегда 200 } }

  # ── Сборки и подключения ────────────────────────────────────────────
  /api/builds:
    get:
      summary: Сборки Агентов
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AgentBuild" } }
    post:
      summary: Создать Сборку
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentBuildInput" } } }
      responses:
        "201":
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentBuild" } } }
  /api/builds/{id}:
    patch:
      summary: Изменить Сборку
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentBuildInput" } } }
      responses:
        "200":
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentBuild" } } }
    delete:
      summary: Удалить Сборку
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: ok } }

  /api/connections/llm:
    get:
      summary: LLM-подключения (ключи маской)
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/LlmConnection" } }
    post:
      summary: Создать LLM-подключение
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, apiBase, apiKey, model]
              properties:
                name: { type: string }
                apiBase: { type: string }
                apiKey: { type: string }
                model: { type: string }
      responses:
        "201":
          content: { application/json: { schema: { $ref: "#/components/schemas/LlmConnection" } } }
  /api/connections/llm/{id}:
    delete:
      summary: Удалить LLM-подключение
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: ok } }
  /api/defaults:
    get:
      summary: Дефолты пустых полей форм (зеркало .env; ключи — только факт наличия)
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  llmApiBase: { type: string }
                  llmModel: { type: string }
                  sandboxDomain: { type: string }
                  sandboxImage: { type: string }
                  sandboxApiKeySet: { type: boolean }
                  limits: { type: object, additionalProperties: true }
  /api/connections/sandbox:
    get:
      summary: Sandbox-подключения (ключи маской)
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SandboxConnection" } }
    post:
      summary: Создать sandbox-подключение
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, domain]
              properties:
                name: { type: string }
                domain: { type: string }
                apiKey: { type: [string, "null"] }
                image: { type: [string, "null"] }
      responses:
        "201":
          content: { application/json: { schema: { $ref: "#/components/schemas/SandboxConnection" } } }
  /api/connections/sandbox/{id}:
    delete:
      summary: Удалить sandbox-подключение
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: ok } }

  # ── Экземпляры Сэндбоксов (владение — юзер/hub; раннер только подключается) ─
  /api/sandbox-instances:
    get:
      summary: Экземпляры Сэндбоксов
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SandboxInstance" } }
    post:
      summary: Создать Экземпляр Сэндбокса (OpenSandbox create, no-TTL)
      description: >
        Hub зовёт OpenSandbox POST /v1/sandboxes с timeout:null (no-TTL) по
        координатам sandbox-подключения (domain/apiKey/image) и пишет строку
        hub.sandbox_instances (status=alive). Раннер песочницы НЕ создаёт.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [sandboxConnectionId]
              properties:
                sandboxConnectionId: { type: integer }
      responses:
        "201":
          content: { application/json: { schema: { $ref: "#/components/schemas/SandboxInstance" } } }
        "400": { description: у подключения не настроен image }
        "404": { description: незнакомое sandbox-подключение }
  /api/sandbox-instances/{id}:
    delete:
      summary: Убить Экземпляр Сэндбокса (OpenSandbox destroy + status=dead)
      description: Идемпотентно; 404 у OpenSandbox (уже нет) — тоже успех.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: ok } }

  # ── Экземпляры ──────────────────────────────────────────────────────
  /api/instances:
    get:
      summary: Экземпляры Агентов
      parameters:
        - { name: repositoryId, in: query, schema: { type: integer } }
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AgentInstance" } }
  /api/instances/{id}:
    get:
      summary: Экземпляр
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          content: { application/json: { schema: { $ref: "#/components/schemas/AgentInstance" } } }
  /api/instances/{id}/messages:
    get:
      summary: Транскрипт чата Экземпляра (история как в ChatGPT — реплики + карточки ходов по Событиям)
      description: >
        Реплики чата (chat_user/chat_agent кадры хода из hub.activity) и карточки
        ходов по Событиям; новые последними. Пагинация назад: more=true →
        повторить с before=<id первой строки>. limit 1..200, дефолт 50.
      parameters:
        - { name: before, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
                  more: { type: boolean }
  /api/instances/{id}/chat:
    post:
      summary: Чат с агентом (SSE; поднимает down-Экземпляр через раннер и проксирует)
      description: >
        Ответ — text/event-stream: последовательность data-кадров, каждый —
        JSON ChatEvent. Терминальный кадр — kind=done, после него поток
        закрывается. Hub проксирует кадры раннера как есть; контракт кадров
        общий для hub↔frontend и runner↔hub. Раннер при занятых слотах НЕ
        отказывает, а ставит запрос в очередь — hub ждёт первый байт щедрый
        таймаут (CHAT_FIRST_BYTE_TIMEOUT_SECONDS, дефолт 120s); истечение —
        504. 409 — нет ни одного живого раннера. У down-Экземпляра без живой
        песочницы hub перед raise сам создаёт её из sandbox_connection Сборки
        и привязывает (502 — OpenSandbox не ответил).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [message], properties: { message: { type: string } } }
      responses:
        "200":
          description: "text/event-stream; каждый кадр: `data: <ChatEvent JSON>\\n\\n`"
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/ChatEvent" }
        "409": { description: нет ни одного живого раннера }
        "504": { description: раннер не начал стримить за отведённое время (очередь) }
  /api/instances/{id}/terminal:
    post:
      summary: Терминал к песочнице Экземпляра (SSE-стрим-консоль; прокси в раннер)
      description: >
        Стрим-консоль, не PTY: каждая команда исполняется в песочнице
        Экземпляра отдельным shell; между командами переносится только рабочая
        директория (env и фоновые процессы — нет). Ответ — text/event-stream из
        TerminalEvent-кадров: output (вывод, stdout+stderr слиты), exit (код и
        новая cwd; после ошибки исполнения code/cwd = null), done. Hub
        проксирует кадры раннера как есть. Connect-only: песочницу создаёт
        пользователь в UI; down-Экземпляр НЕ поднимается и песочница НЕ
        создаётся — 409. Нет живой песочницы — раннер отвечает кадром output с
        текстом ошибки.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [command], properties: { command: { type: string } } }
      responses:
        "200":
          description: "text/event-stream; каждый кадр: `data: <TerminalEvent JSON>\\n\\n`"
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/TerminalEvent" }
        "409": { description: Экземпляр down / раннер пропал — терминал ничего не поднимает }
  /api/instances/{id}/activity:
    get:
      summary: Activity-кадры хода — граф Рана «Лид → Сабагенты» (SSE)
      description: >
        Ответ — text/event-stream из ActivityEvent-кадров. Живой ход
        running-Экземпляра проксируется в его раннер и стримится по мере
        появления; завершённый ход и down-Экземпляр — реплей из hub.activity
        (down hub реплеит сам, без раннера). Без eventId — живой либо
        последний ход (ход чата пишется с event_id NULL и тоже считается
        ходом); eventId выбирает ход конкретного События. Терминальный кадр —
        kind=done, после него поток закрывается.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: eventId, in: query, schema: { type: integer }, description: "ход этого События; без него — живой/последний" }
      responses:
        "200":
          description: "text/event-stream; каждый кадр: `data: <ActivityEvent JSON>\\n\\n`"
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/ActivityEvent" }
  /api/instances/{id}/stop:
    post:
      summary: Опустить Экземпляр (через раннер) — «Остановить ход»
      description: >
        Раннер отменяет исполняющийся ход События (asyncio cancel + ожидание),
        Событие остаётся незавершённым (processed_at NULL), чекпоинт хранит
        уже завершённые шаги — точка «Продолжить». Экземпляр running → down.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: ok } }
  /api/instances/{id}/raise:
    post:
      summary: Поднять Экземпляр (через раннер; быстрый ответ)
      description: >
        Раннер отвечает сразу: слот есть — 200 running; слоты заняты — 202
        queued (hub пробрасывает как есть), раннер поднимет Экземпляр фоном,
        когда слот освободится, и сам зафиксирует running. Нет живой
        песочницы (не привязана / dead) — hub перед raise создаёт её сам из
        sandbox_connection Сборки и привязывает; 502 — OpenSandbox не ответил.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          content:
            application/json:
              schema: { type: object, required: [status], properties: { status: { type: string, enum: [running] } } }
        "202":
          description: слоты раннера заняты — подъём в очереди
          content:
            application/json:
              schema: { type: object, required: [status], properties: { status: { type: string, enum: [queued] } } }
        "409": { description: нет живого Раннера / Экземпляр держит другой раннер }
  /api/instances/{id}/resume:
    post:
      summary: Продолжить — пере-опубликовать незавершённые События Экземпляра
      description: >
        Незавершённые События (instance_events без processed_at) уходят снова
        в outbox (та же механика, что heartbeat-ре-публикация для мёртвых
        раннеров); раннер, получив Событие, поднимет Экземпляр сам и доисполнит
        ход с LangGraph-чекпоинта. Пустой список — нечего продолжать.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [eventIds]
                properties:
                  eventIds: { type: array, items: { type: integer } }
  /api/instances/{id}/sandbox:
    post:
      summary: Привязать Экземпляр Агента к Экземпляру Сэндбокса
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [sandboxInstanceId]
              properties:
                sandboxInstanceId: { type: integer }
      responses:
        "204": { description: ok }
        "409": { description: незнакомый sandboxInstanceId (FK) }
  /api/instances/{id}/reports:
    get:
      summary: Отчёты Экземпляра
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Report" } }
  /api/instances/{id}/findings:
    get:
      summary: Находки Экземпляра (v2, новые сверху)
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/FindingSeverity"
        - $ref: "#/components/parameters/FindingCategory"
        - $ref: "#/components/parameters/FindingEventId"
        - $ref: "#/components/parameters/FindingIntroducedBy"
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Finding" } }
  /api/instances/{id}/findings/export:
    get:
      summary: Табличный экспорт Находок Экземпляра (те же фильтры)
      description: |
        Таблица critical → info: `#, severity, title, category, file:lines, introduced by
        (author @ date, sha7, this event/earlier), cwe/cve, confidence, remediation`.
        CSV — RFC 4180 (CRLF, UTF-8 BOM); md — Markdown-таблица. `Content-Disposition: attachment`.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/ExportFormat"
        - $ref: "#/components/parameters/FindingSeverity"
        - $ref: "#/components/parameters/FindingCategory"
        - $ref: "#/components/parameters/FindingEventId"
        - $ref: "#/components/parameters/FindingIntroducedBy"
      responses:
        "200":
          content:
            text/csv: { schema: { type: string } }
            text/markdown: { schema: { type: string } }
        "400": { description: format не csv|md }

  # ── Раннеры (auth: X-Runner-Token) ──────────────────────────────────
  /api/runners:
    get:
      summary: Список раннеров (UI/отладка; session cookie)
      responses:
        "200":
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Runner" } }
    post:
      summary: Саморегистрация раннера при старте
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, address, slots]
              properties:
                name: { type: string }
                address: { type: string }
                slots: { type: integer }
      responses:
        "201":
          content: { application/json: { schema: { $ref: "#/components/schemas/Runner" } } }
  /api/runners/{id}/heartbeat:
    post:
      summary: Heartbeat раннера
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: ok } }

components:
  parameters:
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      description: Сквозной trace_id (32 hex). Принимается на любом пути; без него hub генерирует свой.
      schema: { type: string, pattern: "^[0-9a-f]{32}$" }
    Id: { name: id, in: path, required: true, schema: { type: integer } }
    FindingSeverity: { name: severity, in: query, schema: { type: string } }
    FindingCategory:
      name: category
      in: query
      schema: { type: string, enum: [injection, auth, crypto, secrets, deps, config, xss, ssrf, path, logic, other] }
    FindingEventId: { name: eventId, in: query, schema: { type: integer }, description: Событие, породившее Находку }
    FindingIntroducedBy: { name: introducedBy, in: query, schema: { type: string, enum: [this_event, earlier] } }
    ExportFormat: { name: format, in: query, required: true, schema: { type: string, enum: [csv, md] } }
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [github, gitlab] }
  headers:
    TraceId:
      description: Сквозной trace_id запроса (принятый либо сгенерированный) — в любом ответе, включая ошибки и SSE.
      schema: { type: string, pattern: "^[0-9a-f]{32}$" }
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [bad_request, unauthorized, not_found, conflict, upstream, unavailable, timeout, internal] }
            message: { type: string }
    Me:
      type: object
      required: [id, displayName, identities]
      properties:
        id: { type: integer }
        displayName: { type: string }
        identities: { type: array, items: { $ref: "#/components/schemas/Identity" } }
    Identity:
      type: object
      required: [id, provider, username]
      properties:
        id: { type: integer }
        provider: { type: string, enum: [github, gitlab] }
        username: { type: string }
        createdAt: { type: string, format: date-time }
    ProviderRepo:
      type: object
      required: [externalId, owner, name]
      properties:
        externalId: { type: string }
        owner: { type: string }
        name: { type: string }
        defaultBranch: { type: [string, "null"] }
        private: { type: boolean }
    Repository:
      type: object
      required: [id, mode, provider, owner, name, identityId]
      properties:
        id: { type: integer }
        identityId: { type: [integer, "null"], description: "null у watch-репо (связки нет)" }
        mode:
          type: string
          enum: [hook, watch]
          description: "hook — свой репо, webhook ставит hub; watch — чужой публичный, без хука, запуск руками (тикет 015)"
        provider: { type: string, enum: [github, gitlab] }
        externalId: { type: string }
        owner: { type: string }
        name: { type: string }
        defaultBranch: { type: [string, "null"] }
        buildId:
          type: [integer, "null"]
          deprecated: true
          description: "тикет 011: Сборка первой подписки; истина — в /subscriptions"
        connectedAt: { type: string, format: date-time }
    BuildSubscription:
      type: object
      required: [id, buildId, repositoryId, actions]
      properties:
        id: { type: integer }
        buildId: { type: integer }
        repositoryId: { type: integer }
        actions: { type: array, items: { type: string }, description: пустой = все действия }
        refMask: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    Event:
      type: object
      required: [id, provider, action, receivedAt]
      properties:
        id: { type: integer }
        provider: { type: string }
        action: { type: string }
        commitSha: { type: [string, "null"] }
        ref: { type: [string, "null"] }
        receivedAt: { type: string, format: date-time }
        traceId: { type: string, description: "сквозной trace_id запроса (вебхук/trigger), породившего Событие; '' до миграции 004" }
        beforeSha: { type: [string, "null"], description: "push: parent-коммит диапазона (payload.before); null при force-push/новой ветке. manual: коммит последнего обработанного События репо" }
        baseSha: { type: [string, "null"], description: "PR/MR: base (pull_request.base.sha / diff_refs.base_sha)" }
        headSha: { type: [string, "null"], description: "PR/MR: head (pull_request.head.sha / diff_refs.head_sha, fallback last_commit.id)" }
        prNumber: { type: [integer, "null"], description: "PR number / MR iid" }
        prTitle: { type: [string, "null"] }
        prBody: { type: [string, "null"], description: "описание PR/MR, обрезано до 4000 символов" }
        changedFiles:
          type: [array, "null"]
          items: { type: string }
          description: "push: объединение added/modified/removed по коммитам payload; PR/MR — null (раннер берёт из diff)"
    AgentBuildInput:
      type: object
      properties:
        name: { type: string }
        llmConnectionId: { type: integer }
        sandboxConnectionId: { type: integer }
        prompt: { type: [string, "null"] }
        memoryPreset: { type: [string, "null"] }
        limits: { type: object }
        isDefault: { type: boolean }
    AgentBuild:
      allOf:
        - { $ref: "#/components/schemas/AgentBuildInput" }
        - type: object
          required: [id, name]
          properties:
            id: { type: integer }
            createdAt: { type: string, format: date-time }
    LlmConnection:
      type: object
      required: [id, name, apiBase, apiKeyMasked, model]
      properties:
        id: { type: integer }
        name: { type: string }
        apiBase: { type: string }
        apiKeyMasked: { type: string, description: "инвариант redaction — только маска" }
        model: { type: string }
    SandboxConnection:
      type: object
      required: [id, name, domain]
      properties:
        id: { type: integer }
        name: { type: string }
        domain: { type: string }
        apiKeyMasked: { type: [string, "null"] }
        image: { type: [string, "null"] }
    SandboxInstance:
      type: object
      required: [id, externalId, sandboxConnectionId, status]
      properties:
        id: { type: integer }
        externalId: { type: string, description: id песочницы у OpenSandbox }
        sandboxConnectionId: { type: integer }
        status: { type: string, enum: [alive, dead] }
        createdAt: { type: string, format: date-time }
        killedAt: { type: [string, "null"], format: date-time }
    AgentInstance:
      type: object
      required: [id, buildId, repositoryId, status]
      properties:
        id: { type: integer }
        buildId: { type: integer }
        repositoryId: { type: integer }
        sandboxInstanceId: { type: [integer, "null"] }
        sandboxExternalId: { type: [string, "null"], description: derived из привязанного Экземпляра Сэндбокса }
        sandboxStatus: { type: [string, "null"], enum: [alive, dead, null] }
        threadId: { type: string }
        status: { type: string, enum: [down, running] }
        runnerId: { type: [integer, "null"] }
        updatedAt: { type: string, format: date-time }
    Runner:
      type: object
      required: [id, name, address, slots]
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: string }
        slots: { type: integer }
        lastHeartbeatAt: { type: string, format: date-time }
    ChatMessage:
      type: object
      description: >
        Строка транскрипта чата. role=user|agent — реплика (text, markdown у agent);
        role=event — карточка хода: status started|finished|failed, action/commitSha
        События (нет у упавшего хода чата — тогда text = причина), findingsCount.
      required: [id, role, ts]
      properties:
        id: { type: integer }
        role: { type: string, enum: [user, agent, event] }
        text: { type: string }
        eventId: { type: integer }
        action: { type: string }
        commitSha: { type: string }
        status: { type: string, enum: [started, finished, failed] }
        findingsCount: { type: integer }
        ts: { type: string, format: date-time }
        traceId: { type: string }
    ChatEvent:
      type: object
      description: >
        Кадр SSE-чата. kind=token — фрагмент ответа по мере генерации (text);
        kind=message — целое сообщение агента (text): фронт заменяет им
        накопленные токены (канон; и фолбэк без стриминга); kind=activity —
        статусная строка о действии агента (text); kind=done — терминальный
        кадр, поток закрывается. Неизвестные kind фронт должен игнорировать.
      required: [kind]
      properties:
        kind: { type: string, enum: [token, message, activity, done] }
        text: { type: [string, "null"], description: "для token/message/activity" }
    ActivityEvent:
      type: object
      description: >
        Кадр activity хода (тикет 012, пишет раннер в hub.activity).
        run_started/run_finished/run_failed — границы хода; node — узел Лида
        отработал (description — имя узла); task_started — Сабагент
        (status: queued → working); task_finished/task_failed — терминал
        Сабагента (status: done|failed|timeout, description — ошибка,
        findingsCount — Находки Сабагента); task_report — самоотчёт Сабагента
        (description — полный текст, для drawer'а графа); done — терминальный
        кадр потока. findingsCount на node/run_* — накопленные Находки Лида.
        Work log (что агент думает и делает): text — мысль/ответ агента, tool_call —
        вызов тула с аргументами (`grep_code(pattern="jwt")`), tool_result — имя тула
        и превью вывода; taskId — кадр Сабагента, без taskId — Лида. chat_user/chat_agent —
        реплики чата (text) для транскрипта. Неизвестные kind фронт должен игнорировать.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [run_started, node, task_started, task_finished, task_failed, task_report, text, tool_call, tool_result, chat_user, chat_agent, run_finished, run_failed, done]
        taskId: { type: [string, "null"], description: "для task_*" }
        description: { type: [string, "null"] }
        status: { type: [string, "null"], enum: [queued, working, done, failed, timeout, null] }
        findingsCount: { type: [integer, "null"] }
        ts: { type: [string, "null"], format: date-time }
        traceId: { type: [string, "null"], description: "сквозной trace_id хода — тот же, что в логах hub/раннера и Langfuse/LangSmith" }
    TerminalEvent:
      type: object
      description: >
        Кадр SSE-стрим-консоли. kind=output — вывод команды (text, stdout+stderr
        слиты); kind=exit — команда завершилась (code — код выхода, cwd — рабочая
        директория после команды; оба null, если shell не дошёл до маркера);
        kind=done — терминальный кадр, поток закрывается. Неизвестные kind фронт
        должен игнорировать.
      required: [kind]
      properties:
        kind: { type: string, enum: [output, exit, done] }
        text: { type: [string, "null"], description: "для output" }
        code: { type: [integer, "null"], description: "для exit" }
        cwd: { type: [string, "null"], description: "для exit" }
    Report:
      type: object
      required: [id, instanceId, summary, createdAt]
      properties:
        id: { type: integer }
        instanceId: { type: integer }
        eventId: { type: [integer, "null"] }
        summary: { type: string, description: markdown-рендер structured (делает раннер) }
        structured:
          oneOf: [{ $ref: "#/components/schemas/ReportStructured" }, { type: "null" }]
          description: null у отчётов до миграции 007
        createdAt: { type: string, format: date-time }
    ReportStructured:
      type: object
      description: Структурированный отчёт хода (hub.reports.structured, пишет раннер).
      properties:
        summary: { type: string }
        scope:
          type: object
          properties:
            eventType: { type: string, enum: [push, pull_request, merge_request, manual, full_scan] }
            range:
              type: object
              description: "push/manual: {before, after}; PR/MR: {base, head}"
              properties:
                before: { type: string }
                after: { type: string }
                base: { type: string }
                head: { type: string }
            filesTouched: { type: integer }
            linesChanged: { type: integer }
        method: { type: array, items: { type: string } }
        findingsBySeverity:
          type: object
          properties:
            critical: { type: integer }
            high: { type: integer }
            medium: { type: integer }
            low: { type: integer }
            info: { type: integer }
        topRisks: { type: array, items: { type: string } }
        recommendations: { type: array, items: { type: string } }
        limitations: { type: array, items: { type: string } }
    Finding:
      type: object
      description: Находка v2 (миграция 007). Новые поля null у старых строк и без blame.
      required: [id, instanceId, severity, createdAt]
      properties:
        id: { type: integer }
        instanceId: { type: integer }
        reportId: { type: [integer, "null"] }
        eventId: { type: [integer, "null"], description: Событие, породившее Находку }
        severity: { type: string }
        title: { type: [string, "null"] }
        description: { type: [string, "null"] }
        impact: { type: [string, "null"] }
        confidence: { type: [string, "null"], enum: [high, medium, low, null] }
        category:
          type: [string, "null"]
          enum: [injection, auth, crypto, secrets, deps, config, xss, ssrf, path, logic, other, null]
        cwe: { type: [string, "null"] }
        cve: { type: [string, "null"] }
        references: { type: [array, "null"], items: { type: string } }
        file: { type: [string, "null"] }
        lineStart: { type: [integer, "null"] }
        lineEnd: { type: [integer, "null"] }
        evidence: { type: [string, "null"] }
        remediation: { type: [string, "null"] }
        blameAuthor: { type: [string, "null"] }
        blameEmail: { type: [string, "null"] }
        blameCommit: { type: [string, "null"] }
        blameDate: { type: [string, "null"], format: date-time }
        blameCommitMessage: { type: [string, "null"] }
        introducedBy: { type: [string, "null"], enum: [this_event, earlier, null] }
        createdAt: { type: string, format: date-time }
