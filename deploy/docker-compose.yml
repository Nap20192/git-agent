# Основано на server/docker-compose.example.yaml из opensandbox-group/OpenSandbox
configs:
  opensandbox-config:
    content: |
      [server]
      host = "0.0.0.0"
      port = 8090
      api_key = "dev-local-key"

      [log]
      level = "INFO"

      [runtime]
      type = "docker"
      execd_image = "opensandbox/execd:v1.1.0"

      [egress]
      image = "opensandbox/egress:v1.1.7"
      readiness_timeout_seconds = 30.0

      [docker]
      network_mode = "bridge"
      # Адрес, по которому клиенты достучатся до портов песочниц.
      # SDK-клиент работает на этой же машине — поэтому localhost.
      host_ip = "localhost"
      port_range_min = 40000
      port_range_max = 60000
      drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
      no_new_privileges = true
      pids_limit = 4096

      [ingress]
      mode = "direct"

services:
  opensandbox-server:
    image: opensandbox/server:latest
    container_name: opensandbox-server
    ports:
      - "8090:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    configs:
      - source: opensandbox-config
        target: /etc/opensandbox/config.toml
    environment:
      - SANDBOX_CONFIG_PATH=/etc/opensandbox/config.toml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: git-agent-hub-rabbitmq
    ports:
      - "5673:5672" # 5672 на хосте занят rabbit соседнего проекта
      - "15673:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: git-agent-postgres
    environment:
      POSTGRES_USER: git_agent
      POSTGRES_PASSWORD: git_agent
      POSTGRES_DB: git_agent
    ports:
      - "5433:5432" # 5432 на хосте занят
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  hub:
    build: ../backend
    container_name: git-agent-hub
    environment:
      DATABASE_URL: postgresql://git_agent:git_agent@postgres:5432/git_agent
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RUNNER_TOKEN: ${RUNNER_TOKEN:-dev-runner-token}
      SECRETS_KEY: ${SECRETS_KEY:?SECRETS_KEY required (64 hex chars)}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
      HUB_ADDR: ":8081"
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITLAB_OAUTH_CLIENT_ID: ${GITLAB_OAUTH_CLIENT_ID:-}
      GITLAB_OAUTH_CLIENT_SECRET: ${GITLAB_OAUTH_CLIENT_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - rabbitmq
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmqdata:
