version: "3"

vars:
  COMPOSE: docker compose -f deploy/docker-compose.yml

tasks:
  default:
    desc: Список задач
    cmds:
      - task --list
    silent: true

  install:
    desc: Установить окружение агента из lock-файла
    dir: agent
    cmds:
      - uv sync

  up:
    desc: Поднять инфраструктуру (OpenSandbox + Postgres)
    cmds:
      - "{{.COMPOSE}} up -d"

  down:
    desc: Остановить инфраструктуру
    cmds:
      - "{{.COMPOSE}} down"

  migrate:
    desc: Применить все миграции БД — agent + backend (идемпотентно)
    dir: agent
    cmds:
      - uv run python -m migrations.migrate

  lint:
    desc: Проверить код линтером (ruff)
    dir: agent
    cmds:
      - uv run ruff check .

  fix:
    desc: Автоисправления линтера + форматирование
    dir: agent
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  fmt:
    desc: Отформатировать код
    dir: agent
    cmds:
      - uv run ruff format .

  test:
    desc: Все тесты агента (unit + integration + e2e; нужны Postgres, RabbitMQ, OpenSandbox)
    dir: agent
    cmds:
      - uv run pytest -q

  test:unit:
    desc: Только unit-тесты (без внешних сервисов)
    dir: agent
    cmds:
      - uv run pytest tests/unit -q

  test:integration:
    desc: Интеграционные тесты (нужен Postgres)
    dir: agent
    cmds:
      - uv run pytest tests/integration -q

  test:e2e:
    desc: E2E-тесты (нужен OpenSandbox)
    dir: agent
    cmds:
      - uv run pytest tests/e2e -q

  check:
    desc: Полная проверка — линтер + тесты агента
    deps: [lint, test]

  runner:
    desc: Раннер — консьюмер Событий RabbitMQ + HTTP API на :8082 (:8081 у hub)
    dir: agent
    cmds:
      - uv run uvicorn runner:app --port 8082

  demo:runner:
    desc: Интерактивное демо Раннера (реальные Rabbit+Postgres, без LLM)
    dir: agent
    interactive: true
    cmds:
      - uv run python scripts/demo_runner.py

  backend:build:
    desc: Собрать Go-бекенд (hub)
    dir: backend
    cmds:
      - go build ./...

  backend:run:
    desc: Запустить Go-бекенд (hub)
    dir: backend
    cmds:
      - go run ./cmd/hub

  backend:test:
    desc: Тесты Go-бекенда (интеграционные скипаются без Postgres)
    dir: backend
    cmds:
      - go test ./...

  tunnel:
    desc: Перезапустить cloudflared-туннель и перепрописать GitHub-хуки (fallback, основной путь — relay)
    cmds:
      - ./scripts/retunnel.sh

  relay:deploy:
    desc: Задеплоить релей вебхуков на Railway (нужен railway login; см. tunnel/README.md)
    dir: tunnel
    cmds:
      - railway up

  relay:pull:
    desc: Локальный пуллер вебхуков — relay → hub :8081 (RELAY_URL/RELAY_TOKEN из .env)
    dir: tunnel
    dotenv: [".env"]
    cmds:
      - go run ./cmd/puller

  front:
    desc: Фронтенд (vite dev, :5173) с http-адаптером к беку
    dir: frontend
    cmds:
      - bun install
      - bun dev

  app:
    desc: Всё приложение — инфраструктура, миграции, hub (:8081), раннер (:8082) и фронт (:5173); Ctrl+C гасит всё
    deps: [up, migrate]
    cmds:
      - |
        bash -c '
        trap "kill 0" INT TERM
        (cd backend && go run ./cmd/hub) &
        (cd agent && uv run uvicorn runner:app --port 8082) &
        (cd frontend && bun install --silent && bun dev) &
        wait'
