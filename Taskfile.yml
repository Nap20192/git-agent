version: "3"

vars:
  COMPOSE: docker compose -f deploy/docker-compose.yml

tasks:
  default:
    desc: Список задач
    cmds:
      - task --list
    silent: true

  install:
    desc: Установить окружение агента из lock-файла
    dir: agent
    cmds:
      - uv sync

  up:
    desc: Поднять инфраструктуру (OpenSandbox + Postgres)
    cmds:
      - "{{.COMPOSE}} up -d"

  down:
    desc: Остановить инфраструктуру
    cmds:
      - "{{.COMPOSE}} down"

  migrate:
    desc: Применить все миграции БД — agent + backend (идемпотентно)
    dir: agent
    cmds:
      - uv run python -m migrations.migrate

  lint:
    desc: Проверить код линтером (ruff)
    dir: agent
    cmds:
      - uv run ruff check .

  fix:
    desc: Автоисправления линтера + форматирование
    dir: agent
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  fmt:
    desc: Отформатировать код
    dir: agent
    cmds:
      - uv run ruff format .

  test:
    desc: Все тесты агента (unit + integration + e2e; нужны OpenSandbox + Postgres)
    dir: agent
    cmds:
      - uv run pytest -q

  test:unit:
    desc: Только unit-тесты (без внешних сервисов)
    dir: agent
    cmds:
      - uv run pytest tests/unit -q

  test:integration:
    desc: Интеграционные тесты (нужен Postgres)
    dir: agent
    cmds:
      - uv run pytest tests/integration -q

  test:e2e:
    desc: E2E-тесты (нужен OpenSandbox)
    dir: agent
    cmds:
      - uv run pytest tests/e2e -q

  formal:
    desc: Проверить только формальную модель рантайма (Lean)
    dir: agent
    cmds:
      - ./formal/check.sh

  check:
    desc: Полная проверка — линтер + тесты (тесты включают Lean-верификацию)
    deps: [lint, test]

  server:
    desc: HTTP-gateway агента (FastAPI) на :8080 (нужны Postgres + OpenSandbox)
    dir: agent
    cmds:
      - uv run uvicorn main:app --port 8080

  runner:
    desc: Раннер — консьюмер Событий RabbitMQ + HTTP API на :8082 (:8081 у hub)
    dir: agent
    cmds:
      - uv run uvicorn runner:app --port 8082

  demo:runner:
    desc: Интерактивное демо Раннера (реальные Rabbit+Postgres, без LLM)
    dir: agent
    interactive: true
    cmds:
      - uv run python scripts/demo_runner.py

  backend:build:
    desc: Собрать Go-бекенд (hub)
    dir: backend
    cmds:
      - go build ./...

  backend:run:
    desc: Запустить Go-бекенд (hub)
    dir: backend
    cmds:
      - go run ./cmd/hub

  backend:test:
    desc: Тесты Go-бекенда (интеграционные скипаются без Postgres)
    dir: backend
    cmds:
      - go test ./...

  front:
    desc: Фронтенд (vite dev, :5173) с http-адаптером к беку
    dir: frontend
    cmds:
      - bun install
      - bun dev

  app:
    desc: Всё приложение — инфраструктура, миграции, бек и фронт (Ctrl+C останавливает оба)
    deps: [up, migrate]
    cmds:
      - |
        bash -c '
        trap "kill 0" INT TERM
        (cd agent && uv run uvicorn main:app --port 8080) &
        (cd frontend && bun install --silent && bun dev) &
        wait'
