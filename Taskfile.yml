version: "3"

vars:
  COMPOSE: docker compose --env-file .env -f deploy/docker-compose.yml
  # humanlog (go install github.com/humanlogio/humanlog/cmd/humanlog@latest) стоит → сервисы пишут JSON и красиво печатаются им; нет → как есть
  HUMANLOG:
    sh: command -v humanlog >/dev/null && echo "| humanlog -m event" || true
  LOGFMT:
    sh: command -v humanlog >/dev/null && echo "LOG_FORMAT=json" || true

tasks:
  default:
    desc: Список задач
    cmds:
      - task --list
    silent: true

  install:
    desc: Установить окружение агента из lock-файла
    dir: agent
    cmds:
      - uv sync

  up:
    desc: Поднять инфраструктуру (OpenSandbox + Postgres)
    cmds:
      - "{{.COMPOSE}} up -d"

  down:
    desc: Остановить инфраструктуру
    cmds:
      - "{{.COMPOSE}} down"

  migrate:
    desc: Применить все миграции БД — agent + backend (идемпотентно)
    dir: agent
    cmds:
      - uv run python -m migrations.migrate

  up-dev:
    desc: Весь dev-стек — инфра (compose), миграции, hub (:8081), раннер (:8082), фронт (:5173), puller; внутри Herdr — по панелям workspace «app», иначе в фоне (логи logs/dev/*.log); повторный вызов доподнимает недостающее
    cmds:
      - "{{.COMPOSE}} up -d"
      - for i in $(seq 1 30); do docker exec git-agent-postgres pg_isready -q 2>/dev/null && break; sleep 2; done
      - task: migrate
      - ./scripts/dev.sh up

  down-dev:
    desc: Погасить dev-стек — сервисы (ctrl+c в панелях Herdr / kill в фоне) и инфру (compose down; данные в volumes остаются)
    cmds:
      - ./scripts/dev.sh down
      - "{{.COMPOSE}} down"

  status-dev:
    desc: Кто из dev-стека жив
    cmds:
      - ./scripts/dev.sh status
      - "{{.COMPOSE}} ps --format 'table {{`{{.Name}}`}}\t{{`{{.Status}}`}}'"

  logs-dev:
    desc: Хвост логов dev-стека вне Herdr (logs/dev/*.log через humanlog, если стоит); внутри Herdr логи — в панелях
    cmds:
      - "tail -n 50 -F logs/dev/*.log {{.HUMANLOG}}"

  lint:
    desc: Проверить код линтером (ruff)
    dir: agent
    cmds:
      - uv run ruff check .

  fix:
    desc: Автоисправления линтера + форматирование
    dir: agent
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  fmt:
    desc: Отформатировать код
    dir: agent
    cmds:
      - uv run ruff format .

  test:
    desc: Все тесты агента (unit + integration + e2e; нужны Postgres, RabbitMQ, OpenSandbox)
    dir: agent
    cmds:
      - uv run pytest -q

  test:unit:
    desc: Только unit-тесты (без внешних сервисов)
    dir: agent
    cmds:
      - uv run pytest tests/unit -q

  test:integration:
    desc: Интеграционные тесты (нужен Postgres)
    dir: agent
    cmds:
      - uv run pytest tests/integration -q

  test:e2e:
    desc: E2E-тесты (нужен OpenSandbox)
    dir: agent
    cmds:
      - uv run pytest tests/e2e -q

  check:
    desc: Полная проверка — линтеры агента и hub + тесты агента
    deps: [lint, test, backend:lint]

  runner:
    desc: Раннер — консьюмер Событий RabbitMQ + HTTP API на :8082 (:8081 у hub)
    dir: agent
    cmds:
      - "{{.LOGFMT}} uv run uvicorn runner:app --port 8082 2>&1 {{.HUMANLOG}}"

  demo:runner:
    desc: Интерактивное демо Раннера (реальные Rabbit+Postgres, без LLM)
    dir: agent
    interactive: true
    cmds:
      - uv run python scripts/demo_runner.py

  backend:build:
    desc: Собрать Go-бекенд (hub)
    dir: backend
    cmds:
      - go build ./...

  backend:run:
    desc: Запустить Go-бекенд (hub)
    dir: backend
    cmds:
      - "{{.LOGFMT}} go run ./cmd/hub 2>&1 {{.HUMANLOG}}"

  backend:lint:
    desc: Линтер Go-бекенда (golangci-lint, конфиг backend/.golangci.yml; установка — go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest)
    dir: backend
    cmds:
      - golangci-lint run ./...

  backend:sqlc:
    desc: Перегенерировать типизированный SQL-слой hub (sqlc.yaml → adapters/postgres/db)
    dir: backend
    cmds:
      - sqlc generate

  backend:test:
    desc: Тесты Go-бекенда (интеграционные скипаются без Postgres)
    dir: backend
    cmds:
      - go test ./...

  sandbox:image:
    desc: Собрать образ Песочницы с инструментами (git, rg, semgrep, bandit, gosec, osv-scanner, node, go); нужен Docker Hub
    cmds:
      - docker build -t git-agent/sandbox:latest deploy/sandbox

  sandbox:image:strix:
    desc: Офлайн-образ Песочницы поверх локального strix-sandbox (git, rg, semgrep, bandit, node, go; без gosec/osv)
    cmds:
      - docker build -t git-agent/sandbox:strix -f deploy/sandbox/Dockerfile.strix deploy/sandbox

  diagrams:
    desc: Отрендерить sequence-диаграммы docs/flows.md → docs/flows/*.png
    cmds:
      - ./scripts/render-diagrams.sh

  tunnel:
    desc: Перезапустить cloudflared-туннель и перепрописать GitHub-хуки (fallback, основной путь — relay)
    cmds:
      - ./scripts/retunnel.sh

  relay:deploy:
    desc: Задеплоить релей вебхуков на Railway (нужен railway login; см. tunnel/README.md)
    dir: tunnel
    cmds:
      - railway up

  relay:pull:
    desc: Локальный пуллер вебхуков — relay → hub :8081 (RELAY_URL/RELAY_TOKEN из корневого .env)
    dir: tunnel
    cmds:
      - bash -c 'set -a; . ../.env; set +a; exec go run ./cmd/puller'

  front:
    desc: Фронтенд (vite dev, :5173) с http-адаптером к беку
    dir: frontend
    cmds:
      - bun install
      - bun dev

  app:
    desc: Всё приложение — инфраструктура, миграции, hub (:8081), раннер (:8082) и фронт (:5173); Ctrl+C гасит всё
    deps: [up, migrate]
    cmds:
      - |
        bash -c '
        trap "kill 0" INT TERM
        (cd backend && {{.LOGFMT}} go run ./cmd/hub 2>&1 {{.HUMANLOG}}) &
        (cd agent && {{.LOGFMT}} uv run uvicorn runner:app --port 8082 2>&1 {{.HUMANLOG}}) &
        (cd frontend && bun install --silent && bun dev) &
        wait'
