[project]
name = "git-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=10.0.1",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.18",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.0",
    "langfuse>=4.15.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langsmith>=0.11.2",
    "opensandbox>=0.1.16",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # flake8-simplify
    "C4",            # comprehensions
    "RUF",           # ruff-specific
]
ignore = [
    "E501",    # длину строк держит formatter, а не линтер
    "B008",    # вызовы в дефолтах аргументов (Depends-стиль)
    "RUF001", "RUF002", "RUF003",  # кириллица в строках/комментариях — намеренно
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "C408"]     # assert и dict(**spread) в тестах — норма
"migrations/*.py" = ["E402"]           # sys.path до импортов при прямом запуске
