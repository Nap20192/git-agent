openapi: 3.1.0
info:
  title: git-agent HTTP API
  version: 0.1.0
  description: >
    The front↔back contract for git-agent. This is the authoritative wire spec:
    the frontend (src/api/contract.ts + http.ts) and the future FastAPI backend
    both implement it. The backend is a thin HTTP layer over the existing
    `core/runtime/runtime.py::Runtime` facade plus the sub-agent system
    (`core/agents/subagents/`). Schema field names are camelCase on the wire;
    the mapping to Python symbols is noted per schema. SSE event payloads are in
    components.schemas.RunEvent.

    Security: `llm_api_key` is stored plaintext in the `runs` table and returned
    by `RunStore.get`. The HTTP layer MUST redact it — only `keyMasked` ever
    crosses the wire. Idempotency: POST /runs is keyed on (repo, commit, model);
    the response carries a `disposition`.

servers:
  - url: /api

paths:
  /runs:
    get:
      summary: List runs
      operationId: listRuns
      responses:
        "200":
          description: All runs
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
    post:
      summary: Submit a run (idempotent per repo+commit+model → Runtime.submit)
      operationId: submitRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitRunRequest" }
      responses:
        "200":
          description: Created/resumed/attached/already-succeeded run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitRunResponse" }
        "409":
          description: Active run held by a live lease (Runtime ConflictError)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /runs/{id}:
    get:
      summary: Get one run (RunStore.get — redact the key)
      operationId: getRun
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: The run
          content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{id}/cancel:
    post:
      summary: Request cancel (Runtime.cancel → cancel_requested_at mailbox)
      operationId: cancelRun
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: The run after the cancel request
          content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } }

  /runs/{id}/resume:
    post:
      summary: Resume a failed/interrupted run (resubmit → disposition "resumed")
      operationId: resumeRun
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: The resumed run + disposition
          content: { application/json: { schema: { $ref: "#/components/schemas/SubmitRunResponse" } } }

  /runs/{id}/report:
    get:
      summary: Get the run's report (runs.report JSONB — nodes.py::report shape)
      operationId: getReport
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: The report
          content: { application/json: { schema: { $ref: "#/components/schemas/Report" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{id}/graph:
    get:
      summary: The run's node graph (pipeline nodes and/or lead+sub-agent star)
      operationId: getGraph
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: Nodes + edges
          content: { application/json: { schema: { $ref: "#/components/schemas/RunGraph" } } }

  /runs/{id}/nodes/{nodeId}:
    get:
      summary: Node spec (procedural node, lead, or sub-agent delegation)
      operationId: getNodeSpec
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - name: nodeId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The node spec
          content: { application/json: { schema: { $ref: "#/components/schemas/NodeSpec" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{id}/events:
    get:
      summary: >
        SSE event stream (MemoryStreamBridge replay + live). Each SSE `data:`
        line is one RunEvent. Resume with `cursor`; the backend replays events
        with cursor > the given value, or emits a `gap` event if the cursor fell
        out of the in-memory buffer (client then refetches via Runtime.events).
      operationId: streamRunEvents
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - name: cursor
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: text/event-stream of RunEvent objects
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/RunEvent" }

  /connections:
    get:
      summary: List saved LLM connections (NET-NEW table; keys redacted)
      operationId: listConnections
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections:
                    type: array
                    items: { $ref: "#/components/schemas/Connection" }
    post:
      summary: Create a connection (apiKey write-only)
      operationId: createConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, apiBase, apiKey, model]
              properties:
                name: { type: string }
                apiBase: { type: string }
                apiKey: { type: string, writeOnly: true }
                model: { type: string }
      responses:
        "200":
          description: Created connection
          content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } }

  /connections/{id}:
    delete:
      summary: Delete a connection
      operationId: deleteConnection
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Deleted }

  /connections/{id}/check:
    post:
      summary: Ping the connection endpoint (GET {apiBase}/models)
      operationId: checkConnection
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Connection with updated lastCheck
          content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } }

  /sandboxes:
    get:
      summary: List sandboxes (sandboxes table)
      operationId: listSandboxes
      responses:
        "200":
          description: Sandboxes
          content:
            application/json:
              schema:
                type: object
                required: [sandboxes]
                properties:
                  sandboxes:
                    type: array
                    items: { $ref: "#/components/schemas/SandboxSpec" }
    post:
      summary: Create a sandbox (ssh kind NotImplemented in the backend)
      operationId: createSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              properties:
                name: { type: string }
                kind: { $ref: "#/components/schemas/SandboxKind" }
                image: { type: string }
                workdir: { type: string }
      responses:
        "200":
          description: Created sandbox
          content: { application/json: { schema: { $ref: "#/components/schemas/SandboxSpec" } } }

  /capabilities:
    get:
      summary: >
        Capabilities catalog. There is NO skills system; this serves the real
        things: sub-agent types (registry.py), the sandbox toolset (tools.py),
        RuntimeFeatures flags (features.py), memory presets (memory/presets.py).
      operationId: listCapabilities
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                type: object
                required: [capabilities]
                properties:
                  capabilities:
                    type: array
                    items: { $ref: "#/components/schemas/Capability" }

  /memory-presets:
    get:
      summary: List memory presets (core/memory/presets.py)
      operationId: listMemoryPresets
      responses:
        "200":
          description: Presets
          content:
            application/json:
              schema:
                type: object
                required: [presets]
                properties:
                  presets:
                    type: array
                    items: { $ref: "#/components/schemas/MemoryPreset" }

components:
  parameters:
    RunId:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }

  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    # ── runs (runs table + core/runtime/schemas.py) ──
    RunStatus:
      type: string
      description: core/runtime/schemas.py::RunStatus. Terminal = succeeded|failed|interrupted (absorbing). Resume failed|interrupted → pending via claim only.
      enum: [pending, running, succeeded, failed, interrupted]
    SubmitDisposition:
      type: string
      description: core/runtime/schemas.py::SubmitDisposition
      enum: [created, resumed, already_succeeded, attached]
    StopReason:
      type: [string, "null"]
      enum: [orphan_recovered, cancelled, shutting_down, null]
    TokenUsage:
      type: object
      description: subagents/contract.py::normalize_token_usage
      required: [inputTokens, outputTokens, totalTokens]
      properties:
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        totalTokens: { type: integer }
    RunConnection:
      type: object
      required: [apiBase, model, keyMasked]
      properties:
        apiBase: { type: string }
        model: { type: string }
        keyMasked: { type: string, description: "runs.llm_api_key masked; raw key never leaves the sandbox" }
    RunMetrics:
      type: object
      required: [agentsActive, agentsTotal, elapsedSec, tokenUsage]
      properties:
        agentsActive: { type: integer }
        agentsTotal: { type: integer }
        elapsedSec: { type: integer }
        tokenUsage:
          oneOf:
            - { $ref: "#/components/schemas/TokenUsage" }
            - { type: "null" }
    Run:
      type: object
      description: A row of the `runs` table + runtime fields.
      required: [id, repositoryId, repoUrl, repo, status, attempt, connection, hasReport, metrics]
      properties:
        id: { type: string }
        repositoryId: { type: string }
        repoUrl: { type: string }
        repo: { type: string, description: "display slug org/name" }
        commitSha: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/RunStatus" }
        error: { type: [string, "null"] }
        stopReason: { $ref: "#/components/schemas/StopReason" }
        cancelRequestedAt: { type: [string, "null"], format: date-time }
        attempt: { type: integer }
        connection: { $ref: "#/components/schemas/RunConnection" }
        sandbox: { type: [string, "null"] }
        memoryPreset: { type: [string, "null"] }
        hasReport: { type: boolean }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
        metrics: { $ref: "#/components/schemas/RunMetrics" }
    SubmitRunRequest:
      type: object
      required: [repoUrl]
      properties:
        repoUrl: { type: string }
        branch: { type: string }
        connectionId: { type: string, description: "saved connection (NET-NEW)" }
        model: { type: string }
        apiBase: { type: string }
        apiKey: { type: string, writeOnly: true }
        sandbox: { type: string, description: "sandbox name (create_sandbox_by_name)" }
        memoryPreset: { type: string }
        features: { $ref: "#/components/schemas/RunFeatures" }
    RunFeatures:
      type: object
      description: >
        Advanced run knobs — RuntimeFeatures flags (features.py) + SubagentCapacity
        + token budget. `subagent` is wired today; `tokenBudget`/`guardrail`/
        `loopDetection` are declared but not yet wired (token_capped/loop_capped
        stop_reasons exist on the sub-agent side).
      properties:
        subagent: { type: boolean }
        maxSubagents: { type: integer, description: "SubagentCapacity concurrency" }
        tokenBudget: { type: [integer, "null"], description: "per-run token budget; null = unlimited" }
        guardrail: { type: boolean }
        loopDetection: { type: boolean }
    SubmitRunResponse:
      type: object
      required: [run, disposition]
      properties:
        run: { $ref: "#/components/schemas/Run" }
        disposition: { $ref: "#/components/schemas/SubmitDisposition" }

    # ── report (nodes.py::report) ──
    ReportModule:
      type: object
      required: [path, classes, functions]
      properties:
        path: { type: string }
        docstring: { type: [string, "null"] }
        classes: { type: array, items: { type: string } }
        functions: { type: array, items: { type: string } }
    ReportStructure:
      type: object
      required: [fileCount, totalBytes, truncated, languages, keyFiles, files]
      properties:
        fileCount: { type: integer }
        totalBytes: { type: integer }
        truncated: { type: boolean }
        languages: { type: object, additionalProperties: { type: integer } }
        keyFiles: { type: array, items: { type: string } }
        files: { type: array, items: { type: string } }
    Report:
      type: object
      required: [repoUrl, commit, description, structure, modules, dependencies, skippedFiles]
      properties:
        repoUrl: { type: string }
        commit: { type: string }
        description: { type: string }
        structure: { $ref: "#/components/schemas/ReportStructure" }
        modules: { type: array, items: { $ref: "#/components/schemas/ReportModule" } }
        dependencies: { type: array, items: { type: string } }
        skippedFiles: { type: array, items: { type: string } }
        error: { type: string }

    # ── graph + node spec ──
    NodeStatus: { type: string, enum: [pending, running, completed, error] }
    NodeKind: { type: string, enum: [procedural, agent] }
    GraphNode:
      type: object
      required: [id, label, kind, status, parentId]
      properties:
        id: { type: string }
        label: { type: string }
        kind: { $ref: "#/components/schemas/NodeKind" }
        status: { $ref: "#/components/schemas/NodeStatus" }
        parentId: { type: [string, "null"], description: "lead id for a delegated sub-agent (star, depth 1)" }
        x: { type: number }
        y: { type: number }
        subagentType: { type: string }
        description: { type: string, description: "task's 3-5 word label" }
        tokenUsage:
          oneOf: [{ $ref: "#/components/schemas/TokenUsage" }, { type: "null" }]
        stopReason: { $ref: "#/components/schemas/SubagentStopReason" }
        subStatus: { $ref: "#/components/schemas/SubagentStatus" }
    GraphEdge:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
        conditional: { type: boolean }
    RunGraph:
      type: object
      required: [runId, nodes, edges]
      properties:
        runId: { type: string }
        nodes: { type: array, items: { $ref: "#/components/schemas/GraphNode" } }
        edges: { type: array, items: { $ref: "#/components/schemas/GraphEdge" } }
    ToolSpec:
      type: object
      required: [name, description]
      properties:
        name: { type: string }
        description: { type: string }
        signature: { type: string }
    NodeSpec:
      type: object
      description: >
        Static description of a node. Procedural: systemPrompt = inline prompt or
        null, tools = sandbox commands. Lead: sandbox toolset + `task` tool.
        Sub-agent: registry type (registry.py) with a delegation runtime.
      required: [id, label, kind, description, systemPrompt, tools, model, memoryPreset]
      properties:
        id: { type: string }
        label: { type: string }
        kind: { $ref: "#/components/schemas/NodeKind" }
        description: { type: string }
        systemPrompt: { type: [string, "null"] }
        tools: { type: array, items: { $ref: "#/components/schemas/ToolSpec" } }
        model: { type: [string, "null"] }
        memoryPreset: { type: [string, "null"] }
        subagentType: { type: string }
        maxTurns: { type: integer }
        timeoutSeconds: { type: number }
        delegation:
          oneOf: [{ $ref: "#/components/schemas/TaskDelegation" }, { type: "null" }]

    # ── sub-agents (core/agents/subagents/) ──
    SubagentStatus:
      type: string
      description: subagents/contract.py::SubagentStatus. Terminal = completed|failed|cancelled|timed_out.
      enum: [pending, running, completed, failed, cancelled, timed_out]
    SubagentStopReason:
      type: [string, "null"]
      description: additive cap reason (never a new status)
      enum: [token_capped, turn_capped, loop_capped, null]
    ToolReceipt:
      type: object
      required: [id, tool, summary]
      properties:
        id: { type: string }
        tool: { type: string }
        summary: { type: string }
    ReceiptVerdict:
      type: object
      description: citation verification of the report against receipts (receipts.py)
      required: [cited, uncited, ok]
      properties:
        cited: { type: integer }
        uncited: { type: integer }
        ok: { type: boolean }
    TaskDelegation:
      type: object
      description: one `task` delegation (task_tool.py inputs + StructuredSubagentResult)
      required: [taskId, subagentType, description, prompt, status, acceptanceCriteria, toolReceipts]
      properties:
        taskId: { type: string }
        subagentType: { type: string }
        description: { type: string }
        prompt: { type: string }
        status: { $ref: "#/components/schemas/SubagentStatus" }
        stopReason: { $ref: "#/components/schemas/SubagentStopReason" }
        error: { type: [string, "null"] }
        acceptanceCriteria: { type: array, items: { type: string } }
        tokenUsage:
          oneOf: [{ $ref: "#/components/schemas/TokenUsage" }, { type: "null" }]
        resultBrief: { type: [string, "null"] }
        toolReceipts: { type: array, items: { $ref: "#/components/schemas/ToolReceipt" } }
        receiptVerdict:
          oneOf: [{ $ref: "#/components/schemas/ReceiptVerdict" }, { type: "null" }]
        startedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }

    # ── event stream ──
    RunEventType:
      type: string
      description: >
        node_update/custom = LangGraph updates chunks (worker.py). task_* =
        sub-agent stream events (task_tool.py writer). status = run status change.
        gap = StreamGap.
      enum: [node_update, custom, task_started, task_running, task_completed, task_failed, task_cancelled, task_timed_out, status, log, gap]
    RunEvent:
      type: object
      required: [cursor, ts, type]
      properties:
        cursor: { type: integer, description: "run_events.id — monotonic, replayable via ?cursor=" }
        ts: { type: string, format: date-time }
        type: { $ref: "#/components/schemas/RunEventType" }
        agent: { type: string, description: "node id or sub-agent task_id this event belongs to" }
        level: { type: string, enum: [info, warn, error] }
        message: { type: string }
        data:
          description: typed payload discriminated by `kind`
          oneOf:
            - type: object
              properties:
                kind: { const: node_status }
                node: { type: string }
                status: { $ref: "#/components/schemas/NodeStatus" }
            - type: object
              properties:
                kind: { const: status }
                status: { $ref: "#/components/schemas/RunStatus" }
            - type: object
              properties:
                kind: { const: task_started }
                taskId: { type: string }
                subagentType: { type: string }
                description: { type: string }
            - type: object
              properties:
                kind: { const: task_step }
                taskId: { type: string }
                messageIndex: { type: integer }
                frameKind: { type: string, enum: [ai, tool] }
                text: { type: string }
                toolName: { type: string }
                toolCalls:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      args: { type: string }
            - type: object
              properties:
                kind: { const: task_terminal }
                taskId: { type: string }
                subagentType: { type: string }
                status: { $ref: "#/components/schemas/SubagentStatus" }
                stopReason: { $ref: "#/components/schemas/SubagentStopReason" }
                error: { type: [string, "null"] }
                usage:
                  oneOf: [{ $ref: "#/components/schemas/TokenUsage" }, { type: "null" }]

    # ── connections / sandboxes / capabilities ──
    Connection:
      type: object
      required: [id, name, apiBase, model, keyMasked, createdAt, lastCheck]
      properties:
        id: { type: string }
        name: { type: string }
        apiBase: { type: string }
        model: { type: string }
        keyMasked: { type: string }
        createdAt: { type: string, format: date-time }
        lastCheck:
          oneOf:
            - type: object
              required: [ok, latencyMs, at]
              properties:
                ok: { type: boolean }
                latencyMs: { type: integer }
                at: { type: string, format: date-time }
            - type: "null"
    SandboxKind: { type: string, enum: [opensandbox, local, ssh] }
    SandboxSpec:
      type: object
      required: [id, name, kind, image, workdir, createdAt, runCount]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/SandboxKind" }
        image: { type: [string, "null"] }
        workdir: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        runCount: { type: integer }
    CapabilitySource: { type: string, enum: [subagent, tool, capability, memory_preset] }
    Capability:
      type: object
      required: [id, name, description, source, active, body, usedBy, tags]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        source: { $ref: "#/components/schemas/CapabilitySource" }
        active: { type: boolean, description: "wired into the run/agent path today" }
        body: { type: string }
        usedBy: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
    MemoryPreset:
      type: object
      required: [name, description, production]
      properties:
        name: { type: string }
        description: { type: string }
        production: { type: boolean }
